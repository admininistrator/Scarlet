# Scarlet — Nginx. KH tham chiếu: §22.3, §22.4, Phụ lục D, C1, C2.
#
# ĐỌC TRƯỚC KHI SỬA FILE NÀY
#
# Bốn dòng trong `location ~ ^/api/v1/(...|_debug/sse)$` là lớp giữ cho streaming
# sống. Xoá bất kỳ dòng nào cũng KHÔNG gây lỗi, không có log, không có alert —
# chỉ là chữ thôi không chảy nữa, và triệu chứng đọc y hệt "model chậm":
#
#   proxy_buffering off       C1 — thiếu: Nginx gom cả câu trả lời rồi trả một cục
#   proxy_read_timeout 3600s  C2 — thiếu: mặc định 60s cắt ngang câu trả lời dài
#   proxy_http_version 1.1    HTTP/1.0 không có chunked transfer-encoding
#   proxy_set_header Connection ''   xoá header hop-by-hop kế thừa
#
# Kiểm bất cứ lúc nào (cần DEBUG=true):
#   curl -kN 'https://localhost/api/v1/_debug/sse'             chữ ra từng dòng
#   curl -kN 'https://localhost/api/v1/_debug/sse?seconds=90'  không đứt ở giây 60

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    log_format scarlet '$remote_addr $request_id "$request" $status '
                       '$body_bytes_sent ${request_time}s';
    access_log /var/log/nginx/access.log scarlet;
    error_log  /var/log/nginx/error.log warn;

    # Mặc định của Nginx còn bật TLSv1/TLSv1.1. Chốt xuống hai phiên bản còn an toàn.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # ─── :80 chỉ để đẩy sang HTTPS ───
    # Phụ lục C mở cổng 80 nhưng Phụ lục D không có server block nào nghe ở đó;
    # không có block này thì :80 rơi vào server mặc định (443) và đứt kết nối.
    # HSTS CHƯA bật — §22.6 chốt chỉ bật sau khi chắc chắn chứng chỉ ổn.
    server {
        listen      80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Health noi bo cho docker healthcheck. Nam trong server :80 vi cong nay
        # KHONG duoc publish ra host — chi container tu goi duoc.
        location = /_nginx_health { access_log off; return 200 "ok"; }

        # Redirect phai nam trong `location /`, KHONG phai o tang server:
        # `return` o tang server chay trong rewrite phase, tuc TRUOC khi nginx
        # chon location, nen no se nuot ca /_nginx_health.
        location / { return 301 https://$host$request_uri; }
    }

    # ══════════════ ORIGIN CHÍNH ══════════════
    server {
        listen      443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

        client_max_body_size 25m;          # khớp tiers.max_upload_mb + đệm

        # ─── SSE: bốn dòng dưới đây là sống còn (C1, C2) ───
        # Location regex được xét TRƯỚC location tiền tố `/api/`, nên đường
        # stream không dính `limit_req` — 30r/s sẽ chặn nhầm client reconnect.
        # T-S.7: `conversations/{id}/title/stream` (stream tiêu đề, §24.2b·S6)
        # phải nằm TRONG regex này — lọt ra ngoài là rơi vào `location /api/`,
        # không có `proxy_buffering off`: tiêu đề im lặng rồi hiện một cục (C1).
        location ~ ^/api/v1/(messages/[^/]+/stream|conversations/[^/]+/title/stream|_debug/sse)$ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;           # C1
            proxy_cache off;
            proxy_read_timeout 3600s;      # C2
            chunked_transfer_encoding on;
            proxy_set_header X-Request-Id $request_id;
        }

        # ─── Presigned URL của MinIO (T-4.1, §15.2, NQ-138 ①) ───
        # `/scarlet/` = MINIO_BUCKET (.env) — đổi bucket là đổi cả dòng này.
        # SigV4 ký cả `Host` lẫn đường dẫn: giữ `Host` đúng như lúc ký
        # (`localhost`, origin của PUBLIC_BASE_URL) và `proxy_pass` KHÔNG có URI
        # để đường dẫn đi nguyên văn. Bucket không có policy ẩn danh — thiếu
        # chữ ký thì MinIO tự trả 403.
        # `access_log off`: query string là chữ ký, tức thẻ vào cửa trong
        # PRESIGN_TTL_S giây — không ghi nó xuống log (Cạm bẫy ⑥).
        location /scarlet/ {
            limit_except GET { deny all; }  # trình duyệt chỉ đọc; GET kéo theo HEAD
            access_log off;
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
        }

        location /api/ {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
        }

        location / {
            proxy_pass http://web:5173;
            # Phu luc D khong co dong nay, nhung thieu no thi Vite nhan
            # Host: web (mac dinh cua proxy_pass la $proxy_host) va tu choi
            # voi "Blocked request... allowedHosts" (Vite 6 chan Host la
            # lat cua no chua duoc khai bao). $host o day la "localhost".
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ══════════════ ORIGIN PHỤ cho artifact (ADR-10, §14.3) ══════════════
    # Origin riêng để artifact do LLM sinh không cùng gốc với app — cookie phiên
    # nằm ngoài tầm với của nó. `connect-src 'none'` chặn artifact tự gọi mạng.
    server {
        listen      443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name artifacts.localhost;

        ssl_certificate     /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

        add_header Content-Security-Policy
          "default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://cdn.jsdelivr.net; img-src data: https:; font-src data: https:; connect-src 'none'; frame-ancestors https://localhost" always;
        add_header X-Content-Type-Options nosniff always;

        # `/artifacts-render/` do T-5.6 dựng; tới lúc đó API trả 404 — nhưng
        # `always` bảo đảm CSP vẫn có mặt trên chính cái 404 đó.
        location / { proxy_pass http://api:8000/artifacts-render/; }
    }
}
