# LiteLLM — cổng DUY NHẤT backend nói chuyện với model (ADR-03, A9).
# Ba model dưới đây là ba model người dùng chốt ở T-0.6; thêm model mới thì
# thêm entry ở đây, KHÔNG hardcode tên model trong .py/.tsx (A3).

model_list:
  # ─── DeepSeek — gọi thẳng, có vision ───
  #     `openai/…` + api_base, KHÔNG `deepseek/…` (B-272 ngả c, NQ-126): adapter
  #     `deepseek/` của LiteLLM 1.102 POP `reasoning_effort` và chỉ gửi
  #     `thinking: {type}`, nên mức low/max không bao giờ tới DeepSeek (đo ở
  #     T-S.2). Provider OpenAI-compatible chung chuyển tham số nguyên văn.
  #     Mất theo: `_fill_reasoning_content` của adapter DeepSeek — chỉ có tác dụng
  #     khi request mang `tools`, tức việc của P6 (B-266).
  - model_name: deepseek-flash
    litellm_params:
      model: openai/deepseek-flash
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY

  # ─── Anthropic — gọi thẳng, LiteLLM chuẩn hoá sang OpenAI format (ADR-03 ②) ───
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ─── 9Router — OpenAI-compatible, chạy NGOÀI Docker trên Windows host (§9.5, C17).
  #     Ghim một model cụ thể thay vì 'auto': để 9Router tự fallback theo tier thì
  #     model trả lời có thể khác model yêu cầu ⇒ đo chi phí sai (§9.5). ───
  - model_name: nr-gemini-flash
    litellm_params:
      model: openai/ag/gemini-3.8-flash-low
      api_base: os.environ/NINEROUTER_BASE_URL
      api_key: os.environ/NINEROUTER_API_KEY

  # Mức `medium` / `high` của `nr-gemini-flash` (`reasoning.options[].alias`
  # trong model_catalog.json): 9Router chọn mức suy luận bằng TÊN model, tham
  # số `reasoning_effort` bị bỏ qua (đo ở T-S.2). Không phải model riêng trong
  # Model Picker — chỉ backend gọi tên này khi người dùng chọn Medium / High.
  - model_name: nr-gemini-flash-medium
    litellm_params:
      model: openai/ag/gemini-3.8-flash-medium
      api_base: os.environ/NINEROUTER_BASE_URL
      api_key: os.environ/NINEROUTER_API_KEY

  - model_name: nr-gemini-flash-high
    litellm_params:
      model: openai/ag/gemini-3.8-flash-high
      api_base: os.environ/NINEROUTER_BASE_URL
      api_key: os.environ/NINEROUTER_API_KEY

  # Claude qua 9Router. Tên upstream viết bằng GẠCH NGANG (`4-6`), không phải
  # dấu chấm: `ag/claude-opus-4.6-thinking` trả 404. Sonnet 4.6 không có bản
  # `-thinking` trên 9Router (404) nên dùng bản thường. Không khối `reasoning`:
  # mức suy luận nằm sẵn trong tên model, không gửi tham số nào.
  - model_name: nr-claude-opus-4.6-thinking
    litellm_params:
      model: openai/ag/claude-opus-4-6-thinking
      api_base: os.environ/NINEROUTER_BASE_URL
      api_key: os.environ/NINEROUTER_API_KEY

  - model_name: nr-claude-sonnet-4.6
    litellm_params:
      model: openai/ag/claude-sonnet-4-6
      api_base: os.environ/NINEROUTER_BASE_URL
      api_key: os.environ/NINEROUTER_API_KEY

  # DeepSeek qua 9Router (nhánh `cmc/`). V4.1 Flash nhận ảnh (đo 2026-11-04:
  # PNG đỏ ⇒ "Red."). Không khối `reasoning`: chưa đo tham số nào.
  - model_name: nr-deepseek-v4-pro
    litellm_params:
      model: openai/cmc/deepseek/deepseek-v4-pro
      api_base: os.environ/NINEROUTER_BASE_URL
      api_key: os.environ/NINEROUTER_API_KEY

  - model_name: nr-deepseek-v4.1-flash
    litellm_params:
      model: openai/cmc/deepseek/deepseek-v4.1-flash
      api_base: os.environ/NINEROUTER_BASE_URL
      api_key: os.environ/NINEROUTER_API_KEY

  # ─── Ollama self-host trong compose (T-0.12) — provider thu tu, bai dien tap
  #     cho R22/S15. api_base la TEN SERVICE, khong phai localhost (C45). ───
  - model_name: ol-qwen-small
    litellm_params:
      model: openai/qwen2.5:0.5b
      api_base: os.environ/OLLAMA_BASE_URL
      api_key:  os.environ/OLLAMA_API_KEY

  - model_name: grok-4.6
    litellm_params:
      model: openai/grok-4.6
      api_base: os.environ/SUB2API_BASE_URL
      api_key: os.environ/SUB2API_API_KEY

litellm_settings:
  drop_params: true          # bỏ tham số provider không hỗ trợ thay vì lỗi 400
  request_timeout: 600
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
