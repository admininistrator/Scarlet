<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scarlet</title>
    <script>
      // Chay truoc khi React mount de tranh nhap nhay mau (FOUC) khi doi theme.
      // Doc §19.1: sang/toi doi bang data-theme tren <html>, mac dinh theo he thong.
      (function () {
        try {
          var saved = localStorage.getItem("scarlet-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <!--
    T-3.2 — nen/chu cua trang song o DAY, khong o mot khoi `body { ... }` trong
    `theme.css`. Ghi chu thi cong cua T-HD1 noi ro ly do: file theme chi duoc co
    dung HAI khoi top-level (`@theme` va `[data-theme="dark"]`), nen mot quy tac
    `body` viet tay se la khoi thu ba — cho ma lan sua theme ke tiep khong ai
    nghi toi khi doi mau nen.

    `min-w-app-min` = --container-app-min = 375px (S8): duoi muc do thi trang
    cuon ngang chu khong bop nat bo cuc.
  -->
  <body class="min-w-app-min bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
