<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!--
      T-3.10 — `interactive-widget=resizes-content`: ban phim ao THU NHO khung
      nhin bo cuc (Chrome Android), nen khung `h-dvh` co lai va o nhap o day
      no noi len tren ban phim thay vi nam duoi. iOS Safari bo qua khoa nay va
      tu cuon phan tu dang focus vao vung nhin thay.
      KHONG dat `maximum-scale`/`user-scalable=no`: chan phong to la loi
      `meta-viewport` cua Lighthouse Accessibility (S8).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Scarlet</title>
    <!--
      T-8.8 — PWA theo T-HD12 · v1; tep o `public/` (Vite phuc vu o goc).
      KHONG service worker (Q-P8-2): Chromium cai duoc chi voi manifest;
      offline => B-413.
      A3: hai mau duoi day la literal BAT BUOC — `<meta>` va manifest khong doc
      duoc var(). Chep tu `--color-background` cua design/theme.css (sang
      #f7f6f4 · toi #171514); `src/pwaColors.test.ts` so lai voi theme.css.
      `media` theo he dieu hanh, khong theo nut doi theme cua app.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171514" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="/favicon-dark.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Scarlet" />
    <script>
      // Chay truoc khi React mount de tranh nhap nhay mau (FOUC) khi doi theme.
      // Doc §19.1: sang/toi doi bang data-theme tren <html>, mac dinh theo he thong.
      (function () {
        try {
          var saved = localStorage.getItem("scarlet-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <!--
    T-3.2 — <body> KHONG con class tien ich nao. Ban T-HD1 hien tai giao mot khoi
    `@layer base` tu dat nen, chu, font, `min-width` va `-webkit-font-smoothing`
    thang tren `body`, nen bon class cu (`min-w-app-min bg-background
    text-foreground antialiased`) deu thanh thua.

    Day la mot dao chieu so voi ban T-HD1 truoc: ban truoc CAM viet quy tac
    `body` trong theme.css ("chi duoc co dung hai khoi top-level") va vi the day
    bon class nay ra day. Ban moi tu viet khoi base, nen cho dat nen quay nguoc
    ve theme.css.

    Quan trong: `min-w-app-min` con nguy hiem hon la thua — token
    `--container-app-min` khong con ton tai trong ban moi, nen Tailwind v4 se
    khong sinh class do va cung KHONG bao loi. San 375px cua S8 se bien mat im
    lang neu ai do tin vao class nay. San ay bay gio den tu
    `body { min-width: var(--spacing-min) }` trong theme.css.
  -->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
