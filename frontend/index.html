<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scarlet</title>
    <script>
      // Chay truoc khi React mount de tranh nhap nhay mau (FOUC) khi doi theme.
      // Doc §19.1: sang/toi doi bang data-theme tren <html>, mac dinh theo he thong.
      (function () {
        try {
          var saved = localStorage.getItem("scarlet-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
