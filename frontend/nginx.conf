# Nginx TINH trong image `web` stage `prod` (T-9.4a) — chi phuc vu `dist/`.
# Nam sau Nginx bien (`config/nginx/templates/`): TLS, nen gzip, header bao
# mat, log deu o do. File nay nap vao `http {}` cua nginx.conf mac dinh.

# B-424 ④: `mime.types` cua nginx:1.27 khong co `webmanifest` ⇒ octet-stream.
# Khoi `types` o CUNG tang `http` voi `include mime.types` thi NOI THEM; dat
# trong `server` / `location` la THAY ca bang (js, css thanh octet-stream).
types { application/manifest+json webmanifest; }

server {
    listen 5173;
    root /usr/share/nginx/html;
    server_tokens off;

    # Nginx bien da ghi moi request; log mac dinh o day (`main`) chua `$request`
    # NGUYEN query — `?token=` cua link thu (T-9.5a, §20).
    access_log off;

    # Ten tep co hash noi dung ⇒ khong bao gio doi ⇒ cache mot nam. Thieu tep
    # thi 404, KHONG roi ve index.html (HTML tra cho `<script>` la loi kho doc).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html, manifest, icon: ten co dinh ⇒ hoi lai moi lan. SPA fallback:
    # moi duong cua router (`/dang-nhap`, `/s/<token>`, …) ⇒ index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
