x-common: &common
  restart: unless-stopped
  env_file: [.env]
  networks: [internal]

services:
  nginx:
    <<: *common
    image: nginx:1.27-alpine
    # Hai lech so voi Phu luc C, ca hai do MOI TRUONG may nay ep, khong phai
    # lua chon kien truc (xem B-37, B-38):
    #  1. Publish IPv4 TUONG MINH thay vi dang rut gon "443:443": MITM server
    #     cua 9Router giu [::]:443 tren host Windows, dang rut gon lam Docker
    #     Desktop publish ca hai stack roi chet voi "ports are not available".
    #  2. KHONG publish :80: project `infra` (WorldVoice) dang giu 0.0.0.0:80.
    #     Nginx VAN nghe :80 trong container va van redirect 301 sang HTTPS —
    #     chi la host chua map toi. Mo lai bang mot dong khi :80 duoc giai phong.
    ports: ["0.0.0.0:443:443"]
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      # Phu luc C khong dinh nghia healthcheck cho nginx, nhung DoD chung §15
      # doi "docker compose ps - moi service healthy". Goi vao location health
      # noi bo tren :80 (cong khong publish). Image nginx:alpine co busybox wget,
      # khong co curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/_nginx_health"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: [core]

  api:
    <<: *common
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # §23: config/ MOUNTED, khong nam trong image. catalog.py doc
    # parents[3]/config/model_catalog.json -> trong container la /config/.
    # Bind-mount la dieu kien de §19.1 dung: sua catalog + POST
    # /admin/catalog/reload co hieu luc ma KHONG phai build lai image.
    volumes: ["./config:/config:ro"]
    healthcheck:
      # Phu luc C ghi curl, nhung image python:3.12-slim KHONG co curl
      # -> healthcheck luon unhealthy va nginx (depends_on: service_healthy)
      # se khong bao gio khoi dong. Cung ly do va cung cach vong nhu litellm
      # ben duoi. Xem B-30.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    profiles: [core]

  worker:
    # T-1.5 — dung y nguyen dinh nghia cua Phu luc C, them hai thu ma Phu luc C
    # khong noi toi (volumes + healthcheck), ly do ghi ngay duoi day.
    <<: *common
    build: ./backend
    command: arq app.workers.main.WorkerSettings
    # Cung ly do voi `api`: §19.1 dat catalog, gia va prompt trong config/
    # MOUNTED, khong nam trong image. Worker la tien trinh doc ca hai thu do
    # (T-1.6 goi app/llm/context.py -> /config/prompts/system.jinja, va
    # model_meta den tu /config/model_catalog.json).
    volumes: ["./config:/config:ro"]
    healthcheck:
      # Worker khong mo cong nao nen khong co gi de curl/wget — `arq --check`
      # doc khoa `arq:queue:health-check` ma chinh worker ghi vao Redis moi
      # WORKER_HEALTHCHECK_S giay (TTL = nhip + 1 s). Mat khoa = vong lap chinh
      # cua worker da dung. Can healthcheck vi DoD chung §15 doi
      # `docker compose ps` moi service healthy.
      #
      # Bien nay TACH khoi WORKER_HEARTBEAT_S o T-1.10 (B-74 -> NQ-27):
      # WORKER_HEARTBEAT_S nay chi con nghia "nhip ghi messages.heartbeat_at"
      # cua §7.6, thu ma reaper doc — hai tang, hai nguoi doc, hai nut van.
      test: ["CMD", "arq", "app.workers.main.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:   { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    profiles: [core]

  postgres:
    <<: *common
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scarlet
      POSTGRES_USER: scarlet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scarlet"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: [core]

  redis:
    <<: *common
    image: redis:7-alpine
    command: >
      redis-server --appendonly yes
      --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: [core]

  minio:
    <<: *common
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 3s
      retries: 5
    profiles: [core]

  migrate:                       # §22.2 — chạy một lần rồi thoát, KHÔNG chạy trong entrypoint của api
    <<: *common
    build: ./backend
    command: alembic upgrade head
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }
    profiles: [core]

  litellm:
    # KHONG dung <<: *common — co chu y, lech voi Phu luc C. Hai ly do:
    #  1. BAT BUOC: env_file: [.env] bom DATABASE_URL=postgresql+asyncpg://... (Phu luc B,
    #     dung cho SQLAlchemy async) vao LiteLLM. LiteLLM validate scheme nay va CHET
    #     -> restart loop, khong phai canh bao. Xem B-29.
    #  2. LiteLLM khong co viec gi phai biet JWT_SECRET, MASTER_ENCRYPTION_KEY,
    #     SMTP_PASSWORD hay MinIO key. Cung ly le voi "sandbox KHONG co env_file" (C27).
    # Dang ${VAR:?} de thieu bien thi compose dung ngay va in dung ten bien — tinh than A4.
    restart: unless-stopped
    networks: [internal]
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes: ["./config/litellm.config.yaml:/app/config.yaml:ro"]
    # T-0.12/NQ-15: key + endpoint cua provider nam trong .env.providers, KHONG
    # liet ke tung bien o day nua. Truoc day moi provider moi la mot dong sua
    # trong file nay -> trai S15 ("them provider = 0 dong code"). .env.providers
    # chi chua bien cua provider, nen C27 (litellm khong thay JWT_SECRET,
    # MinIO key...) va B-29 (khong thay DATABASE_URL) van duoc giu nguyen.
    # Danh doi da biet truoc: mat fail-fast dang ${VAR:?} cho key provider —
    # LiteLLM chi bao loi luc goi model. Buoc 5 cua RUNBOOK bat cho nay.
    env_file: [.env.providers]
    environment:
      LITELLM_MASTER_KEY:   ${LITELLM_MASTER_KEY:?thieu LITELLM_MASTER_KEY}
    extra_hosts: ["host.docker.internal:host-gateway"]   # <- C17
    ports: ["4000:4000"]   # T-0.6 DoD goi truc tiep tu host; nginx chua proxy toi day (Phase 3)
    healthcheck:
      # Phu luc C ghi curl, nhung image ghcr.io/berriai/litellm KHONG co curl
      # (chi co /app/.venv/bin/python3) -> healthcheck luon unhealthy va moi
      # depends_on: service_healthy sau nay se treo. Xem B-30.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    profiles: [core]

  ollama:
    # T-0.12 — provider thu tu, dung lam BAI DIEN TAP cho R22/S15 (khong phai
    # mot tinh nang). Self-host nen KHONG co key nao: cung ly do voi `web` va
    # `sandbox`, service nay khong <<: *common va khong co env_file (C27).
    # base_url ma litellm dung la TEN SERVICE `http://ollama:11434/v1` — khong
    # phai localhost, khong phai host.docker.internal (C45).
    restart: unless-stopped
    networks: [internal]
    image: ollama/ollama:latest
    volumes: ["ollamadata:/root/.ollama"]
    healthcheck:
      # Image ollama khong co curl/wget; CLI `ollama` co san va `list` goi
      # dung API cuc bo, nen no kiem duoc ca tien trinh lan cong 11434.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    profiles: [core]

  web:
    # T-0.10 — Vite dev server (HMR). KHONG dung <<: *common: web khong can
    # bat ky secret nao trong .env (JWT_SECRET, MASTER_ENCRYPTION_KEY,
    # SMTP_PASSWORD, MinIO key...) — cung tinh than voi litellm/sandbox (C27).
    # Bind-mount source de hot-reload nam o docker-compose.override.yml.
    restart: unless-stopped
    networks: [internal]
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      # T-2.6 — khoa CONG KHAI cua widget Turnstile. Anh xa tu chinh
      # TURNSTILE_SITE_KEY chu KHONG them mot bien VITE_ thu hai trong .env:
      # hai dong giu cung mot gia tri la hai cho de lech, va lech o day nghia
      # la widget hien ra nhung token no sinh thuoc ve mot site khac -> backend
      # tu choi bang 400 ma khong ai hieu vi sao.
      #
      # Rong thi widget tu an di (xem components/auth/Turnstile.tsx) - dung
      # khop voi TURNSTILE_SECRET rong o backend.
      VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    healthcheck:
      # node:alpine co busybox wget, khong co curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [core]

networks:
  internal: {}
  egress: {}

volumes: { pgdata: {}, redisdata: {}, miniodata: {}, ollamadata: {} }
