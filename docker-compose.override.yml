# File này LUÔN được docker compose tự nạp cùng docker-compose.yml (không cần
# cờ riêng). Muốn thêm mailpit/adminer thì mới cần: --profile core --profile
# tools --profile dev.
#
# Bind-mount `./frontend` cho hot-reload (T-0.10): volumes là danh sách nên
# compose NỐI THÊM vào volumes rỗng của `web` trong docker-compose.yml, không
# thay thế. `/app/node_modules` là volume ẩn danh để node_modules cài trong
# image (từ Dockerfile) không bị đè bởi bind-mount rỗng phía host.
#
# TODO (B-19): làm tương tự cho `./backend` khi thêm uvicorn --reload cho
# api/worker — chưa làm ở đây vì ngoài phạm vi T-0.10.
services:
  web:
    volumes:
      - ./frontend:/app
      - /app/node_modules

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]
    networks: [internal]
    profiles: [dev]

  adminer:
    image: adminer:latest
    ports: ["8080:8080"]
    networks: [internal]
    profiles: [dev]
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # Publish Postgres ra loopback CHỈ cho test tầng repository (T-1.1).
  # `make test` chạy pytest từ WSL host, ngoài network `internal`, nên không có
  # đường nào tới `postgres:5432`. Test DB dùng database RIÊNG `scarlet_test`
  # trên cùng instance (xem tests/db/conftest.py) — không đụng `scarlet` của dev.
  # Bind 127.0.0.1, không phải 0.0.0.0: cổng không lộ ra LAN.
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
