# File này LUÔN được docker compose tự nạp cùng docker-compose.yml (không cần
# cờ riêng). Muốn thêm mailpit/adminer thì mới cần: --profile core --profile
# tools --profile dev.
#
# Đây là file CHỈ DÀNH CHO DEV. `--reload`/`--watch` và bind-mount source không
# bao giờ được đi vào `docker-compose.yml`.
#
# ─── Bind-mount source (B-19/B-22/B-59/B-75) ────────────────────────────────
# `volumes` là danh sách nên compose NỐI THÊM vào `volumes` của service trong
# `docker-compose.yml`, không thay thế — `./config:/config:ro` của `api`/`worker`
# vẫn còn. `command` là chuỗi nên nó bị THAY, đó là chỗ thêm cờ reload.
#
# Vì sao mount `./backend/app` → `/app/app` chứ không `./backend` → `/app`:
# image đặt `alembic/`, `alembic.ini` và site-packages quanh `/app`, và
# `./backend` phía host còn chứa `.venv` của WSL (T-0.2) — mount đè cả thư mục
# là đưa một venv của host vào chỗ `PYTHONPATH=/app` trỏ tới. Mount đúng phần
# source, đúng như `web` đã làm với `/app/node_modules`.
services:
  web:
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Bằng chứng B-75 đã cắn thật, đo ngay trước khi viết file này: container
  # `api` đang chạy `import app.streaming.producer` -> ModuleNotFoundError, vì
  # image `scarlet-api` được build TRƯỚC T-1.6. Không có bind-mount thì mọi
  # endpoint mới (T-1.7, T-1.8) phải nhớ `--build` mới thấy code — và quên thì
  # nó không báo lỗi, nó chỉ chạy bản cũ.
  api:
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/app
    volumes:
      - ./backend/app:/app/app

  # B-196 — dev cũng phải đi qua `app/workers/run.py` như production.
  #
  # Trước đây dòng này là `arq … --watch /app/app`, tức file override **thay**
  # `command` của `docker-compose.yml` và vô hiệu hoá luôn vòng nối lại: sửa
  # `docker-compose.yml` mà quên file này thì bản vá chạy ở production còn máy
  # dev vẫn giữ nguyên lỗi cũ — đúng loại lệch không ai nhìn thấy cho tới lúc
  # gặp sự cố. `tests/workers/test_run_loop.py::test_compose_goi_dung_module`
  # nay đọc **cả hai** file vì chính chỗ này.
  #
  # `arq --watch` tự gọi `watchfiles` bên trong; ở đây gọi thẳng CLI ấy cho
  # `python -m app.workers.run`. `watchfiles` có sẵn trong image qua
  # `uvicorn[standard]`; cú pháp là `watchfiles <lệnh> <thư mục>`.
  worker:
    command: watchfiles "python -m app.workers.run" /app/app
    volumes:
      - ./backend/app:/app/app

  # `migrate` cần CẢ BA: `alembic/versions/` (file migration mới), `alembic.ini`
  # (`prepend_sys_path`), và `app/` — `alembic/env.py` import
  # `app.config.settings` để lấy DATABASE_URL (A3/A4), nên thiếu nó thì migrate
  # chạy bằng settings của image cũ.
  migrate:
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]
    networks: [internal]
    profiles: [dev]

  adminer:
    image: adminer:latest
    ports: ["8080:8080"]
    networks: [internal]
    profiles: [dev]
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # Publish Postgres ra loopback CHỈ cho test tầng repository (T-1.1).
  # `make test` chạy pytest từ WSL host, ngoài network `internal`, nên không có
  # đường nào tới `postgres:5432`. Test DB dùng database RIÊNG `scarlet_test`
  # trên cùng instance (xem tests/db/conftest.py) — không đụng `scarlet` của dev.
  # Bind 127.0.0.1, không phải 0.0.0.0: cổng không lộ ra LAN.
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
