[project]
name = "scarlet-backend"
version = "0.1.0"
description = "Scarlet chatbot backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "arq>=0.26",
    "openai>=1.50",
    "tiktoken>=0.8",
    "argon2-cffi>=23.1",
    # AES-256-GCM + HKDF cho BYOK (§10.5, T-2.14, app/core/crypto.py).
    # `pycryptodome` da co san trong image vi `minio` keo theo, nhung mot
    # thu vien mat ma dung cho KHOA CUA NGUOI DUNG phai la phu thuoc TRUC
    # TIEP: ngay `minio` doi backend, lop ma hoa khong duoc bien mat theo.
    "cryptography>=43",
    "zxcvbn>=4.4",
    "pyjwt>=2.9",
    "email-validator>=2.0",
    "python-magic>=0.4.27",
    "pillow>=10.4",
    "httpx>=0.27",
    "jinja2>=3.1",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# B-88 — TRẦN THỜI GIAN CHO MỖI TEST.
#
# Không có dòng này thì một lỗi kiểu "vòng lặp không bao giờ thoát" làm bộ test
# TREO thay vì đỏ, và treo là kiểu đỏ không tự khai báo: trên CI nó trông y hệt
# một máy build chậm. Đo thật ở T-1.7: 3 trong 12 phép kiểm ngược (`[cursor`,
# `XREAD` từ `$`, bỏ `: ping`) biến vòng đuổi kịp hoặc vòng BLOCK thành vô hạn,
# `pytest` chạy quá 45 s rồi bị một `timeout` NGOÀI cắt, không in một dòng
# `failed` nào.
#
# 60 s là trần cho MỘT test, không phải cho cả bộ. Mốc để so: cả 400 test hiện
# chạy 12.85 s và test chậm nhất (`test_get_path_tren_cay_500_message_duoi_nguong`)
# mất 0.90 s — tức ngưỡng này rộng gấp ~66× test chậm nhất. Nó cố ý KHÔNG phải
# một phép đo hiệu năng (S14 đo cả bộ < 3 phút bằng `time make test`); nó chỉ
# là cái phanh để một vòng lặp vô hạn tự khai báo thành `Failed: Timeout`.
timeout = 60
